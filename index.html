<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Life Trail · Katiúscia</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 8%,#243567,#0b1028 65%);color:#f3f6ff;font:16px/1.5 system-ui,sans-serif}main{width:min(100%,390px);padding:26px;border-radius:23px;border:1px solid #8aa6e05c;background:#17264ca0;box-shadow:0 22px 65px #0005}h1{margin:5px 0 8px;font-size:28px;line-height:1.15}p{margin:0 0 18px;color:#d7e3ff}small{letter-spacing:.19em;color:#a9c1ff}label{display:block;margin-bottom:6px}input,button{font:inherit;width:100%;min-height:47px;padding:10px 12px;border-radius:11px}input{color:#fff;border:1px solid #889bcb;background:#0f1c3b}button{margin-top:12px;background:#b8ceff;border:0;color:#101d3a;font-weight:650}#aviso{margin:12px 0 0;color:#ffd6cb}#aviso:empty{display:none}
</style></head><body><main><small>STUDIO EVOLUTION TECH</small><h1>Life Trail da Katiúscia</h1><p>Digite o código de acesso para abrir seu painel.</p>
<form id="acesso"><label for="codigo">Código de acesso</label><input id="codigo" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required><button>Entrar</button><p id="aviso" role="status" aria-live="polite"></p></form></main>
<script>
const form=document.getElementById('acesso'),campo=document.getElementById('codigo'),aviso=document.getElementById('aviso'),botao=form.querySelector('button');
let pacote;
form.addEventListener('submit',async e=>{
 e.preventDefault();botao.disabled=true;aviso.textContent='Abrindo o painel…';
 try{
  if(!pacote){const r=await fetch('./app.enc?v=0.2.1');if(!r.ok)throw Error('download');pacote=new Uint8Array(await r.arrayBuffer());if(pacote.length<44)throw Error('download')}
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(campo.value.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:pacote.slice(0,16),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const texto=await crypto.subtle.decrypt({name:'AES-GCM',iv:pacote.slice(16,28)},key,pacote.slice(28));
  campo.value='';document.open();document.write(new TextDecoder().decode(texto));document.close();
 }catch(err){if(err.message==='download')pacote=undefined;aviso.textContent=err.name==='OperationError'?'Código incorreto. Confira e tente de novo.':'Não foi possível abrir o painel agora. Tente novamente.';botao.disabled=false;campo.focus()}
});
</script></body></html>
